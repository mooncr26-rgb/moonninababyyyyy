<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჩემო სიყვარულო</title>
  <style>
    :root { --red: #ff3b30; --dark: #0f0505; }
    body { background: var(--dark); color: #fff; font-family: 'Georgia', serif; text-align: center; margin: 0; padding: 20px; }
    
    /* 3D Envelope Styles */
    .envelope-container { perspective: 1000px; margin: 40px auto; display: flex; justify-content: center; }
    .envelope { 
      width: 200px; height: 140px; background: #e74c3c; border-radius: 5px; 
      position: relative; cursor: pointer; transition: transform 0.4s;
      box-shadow: 0 15px 25px rgba(0,0,0,0.5); transform-style: preserve-3d;
    }
    .envelope:hover { transform: translateY(-10px) rotateX(10deg); }
    .envelope::after { 
      content: '✉️'; font-size: 60px; position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); color: white; text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    /* Before/After Layout */
    .comparison-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .compare-card { width: 45%; max-width: 250px; }
    .compare-card img { width: 100%; border-radius: 10px; border: 2px solid var(--red); }

    /* დანარჩენი სტილები */
    #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    input { padding: 15px; border-radius: 10px; border: 1px solid var(--red); background: #222; color: white; font-size: 1.2rem; text-align: center; }
    button { margin-top: 15px; padding: 10px 30px; background: var(--red); color: white; border: none; border-radius: 10px; cursor: pointer; }
    .hidden { display: none; margin-top: 20px; }
    #success { font-size: 2rem; color: #ffd700; margin-top: 30px; display: none; font-weight: bold; }
  </style>
</head>
<body>

  <div id="password-overlay">
    <h2 style="color:var(--red);">საიდუმლო კარი ❤️</h2>
    <input type="password" id="passInput" placeholder="შეიყვანე პაროლი">
    <button onclick="checkPassword()">შესვლა</button>
  </div>

  <h1>ჩემო სიყვარულო ნინა, მიყვარხარ!</h1>

  <h3>ხინკლის მოტანამდე vs შემდეგ</h3>
  <div class="comparison-container">
    <div class="compare-card">
      <img src="photo1.jpg">
      <p>შენ ხინკლის მოტანამდე</p>
    </div>
    <div class="compare-card">
      <img src="photo2.jpg">
      <p>შენ ხინკლის მოტანის შემდეგ</p>
    </div>
  </div>

  <div class="envelope-container" onclick="openEnvelope()">
    <div class="envelope"></div>
  </div>

  <div id="hidden-content" class="hidden">
    <p>ძვირფასო ნინა, დეითზე ხომ არ წავსულიყავით?</p>
    <button onclick="win()">1) კი</button>
    <button onclick="win()">2) რაზეა საუბარი რათქმაუნდა წამოვალ</button>
  </div>

  <div id="success">გილოცააავ! შენ მოიგე 10 ხინკალი, 1 ცეზარი და 1 ბაკალი ლუდი ოქროს ნალში!</div>

  <script>
    function checkPassword() {
      if (document.getElementById('passInput').value === 'MOONNINA26') {
        document.getElementById('password-overlay').style.display = 'none';
      } else { alert('არასწორია!'); }
    }
    function openEnvelope() {
      document.getElementById('hidden-content').style.display = 'block';
    }
    function win() {
      document.getElementById('hidden-content').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    }
  </script>
</body>
</html>
