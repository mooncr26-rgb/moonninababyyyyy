<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჩემო სიყვარულო</title>
  <style>
    :root { --red: #ff3b30; --dark: #0f0505; }
    body { background: var(--dark); color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    
    /* პაროლის ეკრანი */
    #password-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #password-overlay input { padding: 15px; border-radius: 10px; border: 1px solid var(--red); background: #222; color: white; font-size: 1.2rem; text-align: center; }
    #password-overlay button { margin-top: 15px; padding: 10px 30px; background: var(--red); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }

    h1 { color: #fff; font-size: 2.2rem; margin-top: 30px; }
    .heart { font-size: 50px; color: var(--red); margin-bottom: 30px; }
    
    /* ხინკლის სექცია (გასწორებული ლოგიკით) */
    .comparison-container { display: flex; justify-content: center; gap: 20px; margin: 30px auto; max-width: 600px; }
    .compare-card { width: 50%; background: #1a0505; border: 2px solid #4a0404; border-radius: 15px; padding: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .compare-card img { width: 100%; height: auto; border-radius: 10px; object-fit: contain; }
    .compare-card p { font-size: 1.1rem; margin-top: 10px; color: #ffcccc; font-weight: bold; }

    /* კონვერტი */
    .envelope-section { margin: 50px auto; display: flex; flex-direction: column; align-items: center; }
    .envelope { width: 120px; height: 80px; background: #e74c3c; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .envelope:hover { transform: scale(1.1); background: #c0392b; }

    /* ფარული კითხვა */
    .hidden { display: none; margin: 30px auto; max-width: 500px; padding: 25px; border: 2px dashed var(--red); border-radius: 15px; background: #150808; }
    .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; cursor: pointer; background: var(--red); border: none; color: white; border-radius: 10px; font-weight: bold; font-size: 1.1rem; }
    .btn:hover { background: #ff1a0f; }
    #success { font-size: 2rem; color: #ffd700; margin: 40px auto; display: none; font-weight: bold; max-width: 600px; text-shadow: 0 0 10px rgba(255,215,0,0.3); }

    /* დანარჩენი ფოტოების გალერეა */
    .gallery-title { color: var(--red); margin-top: 60px; font-size: 1.6rem; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; padding: 10px; }
    .gallery-item { background: #1a0505; border: 1px solid #330a0a; border-radius: 12px; padding: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .gallery-item img { width: 100%; height: auto; border-radius: 8px; object-fit: contain; }
  </style>
</head>
<body>

  <div id="password-overlay">
    <h2 style="color:var(--red);">საიდუმლო კარი ❤️</h2>
    <input type="password" id="passInput" placeholder="შეიყვანე პაროლი">
    <button onclick="checkPassword()">შესვლა</button>
  </div>

  <h1>ჩემო სიყვარულო ნინა, მიყვარხარ!</h1>
  <div class="heart">❤️</div>

  <div class="comparison-container">
    <div class="compare-card">
      <img src="photo1.jpg">
      <p>შენ ხინკლის მოტანამდე ⌛</p>
    </div>
    <div class="compare-card">
      <img src="photo2.jpg">
      <p>შენ ხინკლის მოტანის შემდეგ 🥰</p>
    </div>
  </div>

  <div class="envelope-section">
    <div class="envelope" onclick="openLetter()">✉️</div>
  </div>

  <div id="hidden-content" class="hidden">
    <p style="font-size: 1.3rem; margin-bottom: 20px;">დეითზე ხომ არ წავსულიყავით?</p>
    <button class="btn" onclick="win()">1) კი</button>
    <button class="btn" onclick="win()">2) რაზეა საუბარი რათქმაუნდა წამოვალ</button>
  </div>

  <div id="success">
    გილოცააავ შენ მოიგე 10 ხინკალი 1 ცეზარი და 1 ბაკალი ლუდი ოქროს ნალში 🍻
  </div>

  <h2 class="gallery-title">ჩვენი მომენტები ✨</h2>
  <div class="gallery-grid">
    <div class="gallery-item"><img src="photo3.jpg"></div>
    <div class="gallery-item"><img src="photo4.jpg"></div>
    <div class="gallery-item"><img src="photo5.jpg"></div>
    <div class="gallery-item"><img src="photo6.jpg"></div>
    <div class="gallery-item"><img src="photo7.jpg"></div>
    <div class="gallery-item"><img src="photo8.jpg"></div>
  </div>

  <script>
    function checkPassword() {
      if (document.getElementById('passInput').value === 'MOONNINA26') {
        document.getElementById('password-overlay').style.display = 'none';
      } else {
        alert('არასწორი პაროლია!');
      }
    }

    function openLetter() {
      document.getElementById('hidden-content').style.display = 'block';
      document.getElementById('hidden-content').scrollIntoView({ behavior: 'smooth' });
    }
    
    function win() {
      document.getElementById('hidden-content').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      document.getElementById('success').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
